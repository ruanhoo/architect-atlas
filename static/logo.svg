<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="AAA - Alan's Architect Atlas">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#335d79"/>
      <stop offset="1" stop-color="#1d3646"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- horizon -->
  <path d="M62 428H450" stroke="#84a59d" stroke-opacity=".55" stroke-width="6" stroke-linecap="round"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="28">
    <!-- three A peaks sharing their feet: reads as AAA and as a mountain range -->
    <g stroke="#faf8f8">
      <path d="M62 390 114 262 166 390M83 340H146"/>
      <path d="M346 390 398 262 450 390M366 340H429"/>
    </g>
    <path stroke="#a9c8bf" d="M166 390 256 138 346 390M191 320H321"/>
  </g>
  <!-- compass star over the tallest peak: the Atlas -->
  <path d="M256 38 266 66 294 76 266 86 256 114 246 86 218 76 246 66Z" fill="#faf8f8"/>
</svg>
